# EC2 한 대에 올리는 전체 스택.
#
#   caddy   TLS 종료 + 리버스 프록시
#   web     FastAPI (수집 스레드 없음)
#   ingest  수집 배치 (프로세스 하나만)
#   db      Postgres
#
# 수집을 별도 서비스로 뺀 이유: web은 gunicorn 워커가 여러 개라
# 내장 스레드를 쓰면 워커 수만큼 같은 티커를 중복으로 받아 온다.
# 그래서 web은 INGEST_ENABLED=false로 못 박는다.

name: stock-metrics

x-app: &app
  image: ${IMAGE:-ghcr.io/subeom7/mulmit:latest}
  restart: unless-stopped
  environment: &app-env
    DATABASE_URL: postgresql+psycopg://stock:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정하세요}@db:5432/stock
    MARKET_TICKER: ${MARKET_TICKER:-^GSPC}
    SEED_TICKERS: ${SEED_TICKERS:-AAPL,MSFT,SPY,QQQ}
    # 권리 게이트는 web(서빙)과 ingest(수집) 양쪽에서 같은 값이어야 한다.
    # ingest 블록에만 두면 web이 이미지 기본값으로 판정해 운영 설정과 어긋난다.
    LEGACY_PRICE_DATA_ENABLED: ${LEGACY_PRICE_DATA_ENABLED:-false}
    FRED_ENABLED: ${FRED_ENABLED:-false}
    KRX_ENABLED: ${KRX_ENABLED:-false}
    HIP3_PUBLIC_DISPLAY_ENABLED: ${HIP3_PUBLIC_DISPLAY_ENABLED:-false}
    # 같은 카드의 일봉 이력 저장. web(서빙 판정)·ingest(수집) 양쪽에 같은 값.
    HIP3_HISTORY_ENABLED: ${HIP3_HISTORY_ENABLED:-false}
    # 크립토 섹션(페이지·/api/crypto 노출)과 alternative.me 공포·탐욕 relay.
    # 게이트는 web(서빙 판정)·ingest(수집) 양쪽에 같은 값이어야 한다.
    CRYPTO_SECTION_ENABLED: ${CRYPTO_SECTION_ENABLED:-false}
    ALTERNATIVE_ME_ENABLED: ${ALTERNATIVE_ME_ENABLED:-false}
    # Phase 2: CoinMarketCap 도미넌스(키는 ingest에만) · 업비트 김치프리미엄(pending_rights).
    CMC_ENABLED: ${CMC_ENABLED:-false}
    UPBIT_ENABLED: ${UPBIT_ENABLED:-false}
    # 가스 스트립: 스위치는 공통, RPC URL(키 포함)은 요청 경로를 가진 web에만 준다.
    CHAIN_GAS_ENABLED: ${CHAIN_GAS_ENABLED:-false}
    NYFED_ENABLED: ${NYFED_ENABLED:-false}
    FEDBOARD_ENABLED: ${FEDBOARD_ENABLED:-false}
    # 미 재무부 OFR 금융스트레스지수(연방 저작물). web 판정·ingest 수집 양쪽.
    OFR_ENABLED: ${OFR_ENABLED:-false}
    BLS_ENABLED: ${BLS_ENABLED:-false}
    FSC_ENABLED: ${FSC_ENABLED:-false}
    # 한국은행 ECOS(한국 거시). 게이트는 web(서빙 판정)·ingest(수집) 양쪽에 필요하다.
    ECOS_ENABLED: ${ECOS_ENABLED:-false}
    GDELT_ENABLED: ${GDELT_ENABLED:-false}
    KR_PRESS_ENABLED: ${KR_PRESS_ENABLED:-false}
    # 키가 ingest에만 있으면 web의 요청 기반 국내 종목 조회(app/kr_stocks.py)가
    # 잠겨 있는 lane처럼 보인다. 게이트와 마찬가지로 양쪽에 같은 값을 준다.
    FSC_API_KEY: ${FSC_API_KEY:-}
    FSC_MAX_AGE: ${FSC_MAX_AGE:-43200}
    FSC_HISTORY_DAYS: ${FSC_HISTORY_DAYS:-1830}
    # DART도 FSC와 같은 이유로 web·ingest 양쪽에 준다: 요청 기반 조회는 web에서 돈다.
    DART_ENABLED: ${DART_ENABLED:-false}
    # 하원 PTR 게이트. web은 판정, ingest는 수집에 쓴다 — 값이 다르면 어긋난다.
    US_PTR_ENABLED: ${US_PTR_ENABLED:-false}
    DART_API_KEY: ${DART_API_KEY:-}
    DART_MAX_AGE: ${DART_MAX_AGE:-43200}
    SEC_EDGAR_ENABLED: ${SEC_EDGAR_ENABLED:-false}
    # web은 lane 판정에만 쓰고 EDGAR를 호출하지 않지만, 값이 다르면 서빙과 수집의
    # 판정이 어긋나므로 같은 값을 넘긴다.
    SEC_EDGAR_USER_AGENT: ${SEC_EDGAR_USER_AGENT:-}
    PRICE_MAX_AGE: ${PRICE_MAX_AGE:-72000}
    FRED_MAX_AGE: ${FRED_MAX_AGE:-21600}
    REPORT_TTL: ${REPORT_TTL:-86400}
    DEFAULT_SIMS: ${DEFAULT_SIMS:-5000}
    MAX_SIMS: ${MAX_SIMS:-50000}
    TZ: Asia/Seoul
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정하세요}
      POSTGRES_DB: stock
      TZ: Asia/Seoul
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock -d stock"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # 인터넷에는 열지 않는다. 인스턴스 루프백(127.0.0.1)에만 바인딩하고,
    # 로컬 GUI(DBeaver 등)는 SSM 포트포워딩 터널로 들어온다:
    #   aws ssm start-session --target <instance> \
    #     --document-name AWS-StartPortForwardingSession \
    #     --parameters portNumber=5433,localPortNumber=15432
    ports:
      - "127.0.0.1:5433:5432"

  web:
    <<: *app
    environment:
      <<: *app-env
      INGEST_ENABLED: "false"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      # 운영자 RPC 계정 URL(키 내장) — 가스 스트립 요청 경로 전용. 로그·응답에 노출되지 않는다.
      CHAIN_RPC_ETHEREUM_URL: ${CHAIN_RPC_ETHEREUM_URL:-}
      CHAIN_RPC_BASE_URL: ${CHAIN_RPC_BASE_URL:-}
      CHAIN_RPC_ARBITRUM_URL: ${CHAIN_RPC_ARBITRUM_URL:-}
      CHAIN_RPC_PROVIDER_NAME: ${CHAIN_RPC_PROVIDER_NAME:-}
    expose:
      - "8000"

  ingest:
    <<: *app
    command: ["python", "-m", "app.ingest", "--loop"]
    environment:
      <<: *app-env
      INGEST_ENABLED: "true"
      INGEST_INTERVAL: ${INGEST_INTERVAL:-900}
      INGEST_BATCH_SIZE: ${INGEST_BATCH_SIZE:-40}
      INGEST_DELAY: ${INGEST_DELAY:-1.5}
      # 키와 수집 튜닝값은 수집 프로세스에만 필요하다. 게이트 자체는 x-app에 있다.
      FRED_API_KEY: ${FRED_API_KEY:-}
      FRED_TIMEOUT: ${FRED_TIMEOUT:-15}
      FRED_RETRIES: ${FRED_RETRIES:-2}
      FRED_INGEST_DELAY: ${FRED_INGEST_DELAY:-0.1}
      KRX_API_KEY: ${KRX_API_KEY:-}
      ECOS_API_KEY: ${ECOS_API_KEY:-}
      CMC_API_KEY: ${CMC_API_KEY:-}
      CMC_MAX_AGE: ${CMC_MAX_AGE:-900}
      ECOS_MAX_AGE: ${ECOS_MAX_AGE:-21600}
      BLS_API_KEY: ${BLS_API_KEY:-}
      BLS_MAX_AGE: ${BLS_MAX_AGE:-43200}
      FEDBOARD_MAX_AGE: ${FEDBOARD_MAX_AGE:-43200}
      FEDBOARD_HISTORY_DAYS: ${FEDBOARD_HISTORY_DAYS:-9150}
      OFR_MAX_AGE: ${OFR_MAX_AGE:-21600}
      OFR_HISTORY_DAYS: ${OFR_HISTORY_DAYS:-3660}
      NYFED_MAX_AGE: ${NYFED_MAX_AGE:-21600}
      NYFED_HISTORY_DAYS: ${NYFED_HISTORY_DAYS:-3660}
      SEC_EDGAR_TICKERS: ${SEC_EDGAR_TICKERS:-AAPL,MSFT,NVDA,GOOGL,TSLA}
      SEC_EDGAR_FILING_LIMIT: ${SEC_EDGAR_FILING_LIMIT:-40}
      SEC_EDGAR_BATCH_SIZE: ${SEC_EDGAR_BATCH_SIZE:-5}
      SEC_EDGAR_REQUEST_INTERVAL: ${SEC_EDGAR_REQUEST_INTERVAL:-0.15}
      KRX_TIMEOUT: ${KRX_TIMEOUT:-15}
      KRX_RETRIES: ${KRX_RETRIES:-2}
    healthcheck:
      disable: true

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN을 .env에 설정하세요}
      # 비워 두면 www 블록이 www.localhost로 떠서 실질적으로 비활성화된다
      WWW_DOMAIN: ${WWW_DOMAIN:-www.localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
