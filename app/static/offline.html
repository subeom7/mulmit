<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0c0f">
  <title>오프라인 — 물밑 Mulmit</title>
  <!-- 서비스 워커가 캐시해 두었다가 네트워크가 없을 때 보여 주는 페이지.
       자기 완결이어야 한다 — 외부 CSS·JS·폰트·이미지를 참조하는 순간
       오프라인에서 그 부분이 깨진다. 전부 인라인. -->
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: linear-gradient(180deg, #0a0c0f 0%, #070809 100%);
      color: #f3f6f8;
      font-family: Pretendard, "Pretendard Variable", -apple-system, "Malgun Gothic", sans-serif;
      text-align: center;
    }
    main { padding: 2rem; }
    svg { width: 64px; height: 64px; margin-bottom: 1.25rem; }
    h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
    p { margin: 0 0 1.5rem; color: #9aa7b2; font-size: .95rem; line-height: 1.6; }
    button {
      font: inherit; color: #f3f6f8; background: none;
      border: 1px solid #2a3138; border-radius: 8px;
      padding: .6rem 1.4rem; cursor: pointer;
    }
    button:hover { border-color: #42a5ff; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <clipPath id="above"><rect width="64" height="32.5"></rect></clipPath>
        <clipPath id="below"><rect y="35.5" width="64" height="28.5"></rect></clipPath>
      </defs>
      <rect width="64" height="64" rx="14" fill="#0f1214"></rect>
      <path d="M10 52 V12 H22 L32 29 L42 12 H54 V52 H44 V28 L32 45 L20 28 V52 Z" fill="#f3f6f8" clip-path="url(#above)"></path>
      <path d="M10 52 V12 H22 L32 29 L42 12 H54 V52 H44 V28 L32 45 L20 28 V52 Z" fill="#42a5ff" clip-path="url(#below)"></path>
    </svg>
    <h1>지금은 오프라인입니다</h1>
    <p>물밑은 실시간 시장 신호를 보여 드리는 곳이라, 연결 없이는 낡은 값을 그려 드리지 않습니다.<br>
       네트워크가 돌아오면 다시 시도해 주세요. / You appear to be offline.</p>
    <button type="button" onclick="location.reload()">다시 시도</button>
  </main>
</body>
</html>
