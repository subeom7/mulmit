[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # 줄 길이는 포매터가 아니라 사람이 판단한다
    "B008",   # FastAPI의 Query(...) 기본값 관용구
    "SIM108", # 삼항 강요가 항상 더 읽히는 건 아니다
    "UP038",  # isinstance(x, (int, float))가 x | y보다 런타임이 빠르다
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]      # 픽스처 순서상 import가 뒤로 가는 경우가 있다
"scripts/*" = ["E402"]    # sys.path 조정 후 import

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:pkg_resources",
]
